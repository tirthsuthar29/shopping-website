<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Products - NOVATECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .compare-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(var(--surface-color-rgb, 255, 255, 255), 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            min-width: 800px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        [data-theme="dark"] .compare-table {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(255,255,255,0.05);
        }

        .compare-table th, .compare-table td {
            padding: 25px;
            text-align: center;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: background 0.3s;
        }

        [data-theme="dark"] .compare-table th, [data-theme="dark"] .compare-table td {
            border-color: rgba(255,255,255,0.05);
        }

        .compare-table tr:last-child th, .compare-table tr:last-child td {
            border-bottom: none;
        }

        .compare-table th {
            width: 25%;
            background: rgba(0,0,0,0.02);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--primary-color);
        }

        .compare-table th:first-child, .compare-table td:first-child {
            width: 20%;
            text-align: left;
            font-weight: 800;
            background: rgba(0,0,0,0.03);
            color: var(--text-primary);
            position: sticky;
            left: 0;
            z-index: 5;
        }

        [data-theme="dark"] .compare-table th:first-child, [data-theme="dark"] .compare-table td:first-child {
            background: rgba(255,255,255,0.02);
        }

        .compare-img-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .compare-img-card:hover {
            transform: translateY(-5px) rotateX(10deg);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        [data-theme="dark"] .compare-img-card {
            background: rgba(255,255,255,0.05);
        }

        .compare-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
        }

        .ai-glass-container {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-top: 50px;
            position: relative;
            overflow: hidden;
        }

        .ai-glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0.1;
            pointer-events: none;
        }

        .ai-chart-panel {
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }
        
        [data-theme="dark"] .ai-chart-panel {
            background: rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.05);
        }

        .ai-chart-panel:hover {
            transform: scale(1.02);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            margin: 0 3px;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Modal Search & Layout Fixes */
        .search-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .search-modal-content {
            background: var(--surface-color);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: modalSlideIn 0.3s ease-out;
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes modalSlideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .search-results-list {
            margin-top: 25px;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        
        .search-result-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .search-result-item:hover {
            background: var(--primary-color);
            color: white;
            padding-left: 25px;
        }

        .remove-compare-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .remove-compare-btn:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
        }

        .add-compare-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            background: rgba(0,0,0,0.02);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-compare-slot:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(99, 102, 241, 0.05);
            transform: scale(0.98);
        }

    </style>
</head>
<body class="bg-dots">
    <!-- Global 3D Background Canvas -->
    <canvas id="bg-3d-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; opacity: 0.4;"></canvas>

    <header>
        <div class="container">
            <a href="../index.html" class="logo">NOVATECH</a>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="compare.html" class="active">Compare</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <i class="fas fa-search"></i>
                    <div id="searchResults" class="glass search-results-dropdown"></div>
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="wishlist.html" class="icon-btn"><i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span></a>
                <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                <a href="login.html" class="icon-btn" id="userBtn"><i class="far fa-user"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div style="display:flex; flex-direction:column; align-items:center; margin-top:40px;">
            <h1 class="section-title" style="margin-bottom:10px;">Compare Products</h1>
            <button class="btn btn-outline" id="clearCompareBtn" style="border-radius:20px; padding:5px 20px; font-size:0.85rem; margin-bottom:20px; display:none;">
                <i class="fas fa-trash-alt" style="margin-right:5px;"></i> Clear All
            </button>
        </div>
        <p style="text-align:center; color:var(--text-secondary); margin-bottom: 30px;">Select up to 3 products to compare their features side-by-side.</p>

        <div class="compare-container">
            <table class="compare-table" id="compareTable">
                <!-- Injected via JS -->
            </table>
        </div>
        
        <div id="aiSummarySection" style="display:none;" class="ai-glass-container">
            <div style="display:flex; align-items:center; gap:20px; margin-bottom:30px;">
                <div class="chat-bot-avatar" style="background: linear-gradient(to bottom, #6366f1, #8b5cf6); color:white; width:50px; height:50px; font-size:1.5rem; border-radius:15px; display:flex; align-items:center; justify-content:center; box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);">
                    <i class="fas fa-brain"></i>
                </div>
                <div>
                    <h3 style="margin:0; font-size:1.5rem; font-weight:800;">AI Tech Intelligence</h3>
                    <span style="color:var(--text-secondary); font-size:0.9rem;">Analytical product comparison report</span>
                </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr; gap: 40px;">
                <div id="aiSummaryContent" style="color:var(--text-primary); line-height:1.8; font-size:1.1rem; padding:20px; background:rgba(255,255,255,0.03); border-radius:15px;">
                    <!-- Injected by JS -->
                </div>
                <div style="display:none; grid-template-columns: 1fr 1fr; gap: 30px; height:400px;" id="aiChartContainer">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

    </main>
    
    <!-- Search Modal -->
    <div class="search-modal" id="searchModal">
        <div class="search-modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Add Product to Compare</h3>
                <button class="icon-btn" onclick="closeCompareSearch()"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="compareSearchInput" class="form-control" placeholder="Search for a product...">
            <div class="search-results-list" id="compareSearchResults">
                <!-- populated by search -->
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 NOVATECH. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/products-data.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/3d-effects.js?v=1.1"></script>
</body>
</html>
