<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - NOVATECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .orders-layout {
            margin: 40px 0;
        }

        .order-card {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .order-header {
            background: rgba(99, 102, 241, 0.05);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .order-header-info {
            display: flex;
            gap: 30px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .info-value {
            font-weight: 600;
        }

        .order-body {
            padding: 20px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .order-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .order-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-placed { background: #e0f2fe; color: #0284c7; }
        .status-shipped { background: #fef08a; color: #a16207; }
        .status-out { background: #fed7aa; color: #c2410c; }
        .status-delivered { background: #dcfce3; color: #166534; }

        @media (max-width: 768px) {
            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .order-header-info {
                flex-wrap: wrap;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <a href="../index.html" class="logo">NOVATECH</a>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="compare.html">Compare</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <i class="fas fa-search"></i>
                    <div id="searchResults" class="glass search-results-dropdown"></div>
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="wishlist.html" class="icon-btn"><i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span></a>
                <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                <a href="login.html" class="icon-btn" id="userBtn"><i class="far fa-user" style="color:var(--primary-color);"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div class="orders-layout">
            <h1 class="section-title">Order History</h1>
            
            <div id="ordersList">
                <!-- Orders injected by JS -->
            </div>
        </div>

    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 NOVATECH. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/products-data.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/orders.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
