<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NOVATECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .auth-header p {
            color: var(--text-secondary);
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        .form-btn {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            margin-top: 10px;
            cursor: pointer;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body class="bg-mesh">

    <header>
        <div class="container">
            <a href="../index.html" class="logo">NOVATECH</a>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="compare.html">Compare</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <i class="fas fa-search"></i>
                    <div id="searchResults" class="glass search-results-dropdown"></div>
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="wishlist.html" class="icon-btn"><i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span></a>
                <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                <a href="login.html" class="icon-btn" id="userBtn"><i class="fas fa-user" style="color:var(--primary-color);"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="auth-container glass">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join NOVATECH to get the best deals</p>
            </div>

            <form id="signupForm">
                <div class="name-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" required>
                    <div class="error-message" id="regEmailError">Email already exists or is invalid</div>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" required>
                    <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:5px;">Must be at least 6 characters</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <div class="error-message" id="matchError">Passwords do not match</div>
                </div>

                <label style="display:flex; align-items:flex-start; gap:10px; font-size:0.9rem; margin-bottom:20px; line-height:1.4;">
                    <input type="checkbox" id="agreeTerms" style="margin-top:4px;">
                    <span>I agree to the <a href="#" style="color:var(--primary-color);">Terms of Service</a> and <a href="privacy-policy.html" style="color:var(--primary-color);">Privacy Policy</a></span>
                </label>

                <button type="submit" class="btn btn-primary form-btn">Sign Up</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/products-data.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
