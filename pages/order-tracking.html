<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - NOVATECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tracking-container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--surface-color);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }

        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 60px 0;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--border-color);
            z-index: 1;
        }

        .progress-bar {
            position: absolute;
            top: 25px;
            left: 0;
            height: 4px;
            background: var(--success-color);
            z-index: 2;
            transition: width 0.5s ease;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            width: 100px;
            position: relative;
        }

        .step-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--surface-color);
            border: 4px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .step.active .step-icon {
            border-color: var(--success-color);
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        .step.completed .step-icon {
            background: var(--success-color);
            border-color: var(--success-color);
            color: white;
        }

        .step-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            color: var(--text-secondary);
        }

        .step.active .step-label,
        .step.completed .step-label {
            color: var(--text-primary);
        }

        .order-details-card {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }
        
        .items-preview img {
            width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-right: 10px;
        }

    </style>
</head>
<body>

    <header>
        <div class="container">
            <a href="../index.html" class="logo">NOVATECH</a>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="compare.html">Compare</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <i class="fas fa-search"></i>
                    <div id="searchResults" class="glass search-results-dropdown"></div>
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="wishlist.html" class="icon-btn"><i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span></a>
                <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                <a href="login.html" class="icon-btn" id="userBtn"><i class="far fa-user"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div style="max-width: 800px; margin: 60px auto 20px; text-align: center;">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Track Your Order</h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Enter your Order ID to see the current status and delivery updates.</p>
            
            <div style="display: flex; gap: 10px; max-width: 500px; margin: 0 auto; background: var(--surface-color); padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
                <input type="text" id="orderTrackInput" class="form-control" placeholder="e.g. ORD-123456" style="border:none; background:transparent;">
                <button class="btn btn-primary" id="trackSubmitBtn" style="border-radius: 8px;">Track</button>
            </div>
        </div>

        <div class="tracking-container glass" id="trackingWrapper" style="display:none;">
            <!-- Injected by JS -->
        </div>

        <div id="noOrderFound" style="display:none; text-align:center; padding: 40px;">
            <i class="fas fa-search-minus" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 15px;"></i>
            <h3>No Order Found</h3>
            <p style="color: var(--text-secondary);">We couldn't find an order with that ID. Please check and try again.</p>
        </div>

    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/products-data.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/orders.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
