<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - NOVATECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        .empty-wishlist {
            text-align: center;
            padding: 80px 20px;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            margin: 40px 0;
        }

        .wishlist-item-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--danger-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .wishlist-item-btn:hover {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .move-to-cart-btn {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body class="bg-dots">
    <!-- Global 3D Background Canvas -->
    <canvas id="bg-3d-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; opacity: 0.4;"></canvas>

    <header>
        <div class="container">
            <a href="../index.html" class="logo">NOVATECH</a>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="compare.html">Compare</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <i class="fas fa-search"></i>
                    <div id="searchResults" class="glass search-results-dropdown"></div>
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="wishlist.html" class="icon-btn"><i class="fas fa-heart" style="color:var(--primary-color);"></i><span class="badge" id="wishlistCount">0</span></a>
                <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                <a href="login.html" class="icon-btn" id="userBtn"><i class="far fa-user"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 40px; margin-bottom: 20px;">
            <h1 class="section-title" style="margin:0;">My Wishlist</h1>
            <button class="btn btn-outline" onclick="clearWishlist()" id="clearWishlistBtn" style="display:none;">Clear Wishlist</button>
        </div>

        <div id="wishlistLayout">
            <!-- Items injected by JS -->
        </div>

    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 NOVATECH. All rights reserved. | <a href="privacy-policy.html" style="color:var(--text-secondary); text-decoration:none;">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <div id="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/products-data.js?v=1.1"></script>
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/3d-effects.js?v=1.1"></script>
</body>
</html>
